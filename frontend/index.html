<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#001a23" />
    <meta name="description" content="Vincula conecta egresados de universidades públicas, empleadores y universidades con nuevas oportunidades laborales." />
    <title>Vincula | Red de talento universitario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <script>
      try {
        localStorage.removeItem('vincula.theme');
        localStorage.removeItem('vincula.sidebar.theme');
        localStorage.removeItem('vincula.institution.admin.theme');
        document.documentElement.classList.remove('dark');
        document.documentElement.setAttribute('data-theme', 'light');
        if (window.location.pathname.startsWith('/institucion/admin')) {
          var savedIesTheme = localStorage.getItem('vincula.ies.admin.theme.v2') || 'verde-oscuro';
          document.documentElement.setAttribute('data-ies-theme', savedIesTheme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
